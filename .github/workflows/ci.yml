name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 実行する工場環境
        type: choice
        default: all
        options: [all, macos-native, linux-native, windows-native, wsl2]

permissions:
  contents: read

jobs:
  full:
    uses: kitepon/dotagents/.github/workflows/factory-full-ci.yml@main
    with:
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'all' }}
      dependency-command: corepack pnpm install --frozen-lockfile
      full-command: >-
        corepack pnpm build &&
        corepack pnpm typecheck &&
        corepack pnpm check:release-smoke &&
        corepack pnpm test:claude-fresh-session-smoke &&
        corepack pnpm test
